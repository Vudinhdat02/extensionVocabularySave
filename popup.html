<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 12px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin: 0;
      background: #f9f9f9;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .status-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #1976D2;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    .btn-toggle-widget {
      background: #1976D2;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-toggle-widget:hover {
      background: #1565C0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-box">
      <span>Trạng thái Ext:</span>
      <label class="switch">
        <input type="checkbox" id="ext-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <button id="btn-show-widget" class="btn-toggle-widget">Ẩn/Hiện Bảng Từ</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
